server:
  # Port per defecte fora de Docker: 8085, perquè el 8080 ja l'ocupa phpMyAdmin
  # quan el projecte s'aixeca amb docker-compose. Dins del contenedor porta el
  # valor 8080 (SERVER_PORT=8080 a docker-compose; coherent amb el EXPOSE 8080).
  port: 8085

spring:
  application:
    name: actors
  datasource:
    # Les variables DB_* tenen valors per defecte per treballar localment
    # sense Docker; docker-compose les sobrescriu (DB_HOST=mariadb, etc.).
    # Esquema jdbc:mariadb:// obligatori: el mariadb-java-client 3.5.x només
    # accepta l'esquema jdbc:mysql:// si l'URL porta el paràmetre
    # permitMysqlScheme (sense això, el driver rebutja la URL i el context
    # no s'obri). Els paràmetres useSSL/allowPublicKeyRetrieval/serverTimezone
    # són compatibles (el connector els interpreta com a aliases de Connector/J).
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:videoteca}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    # El connector MariaDB admet l'esquema jdbc:mysql:// (compatibilitat amb
    # Connector/J), però el declarem explícitament perquè Spring Boot no el
    # dedueix d'aquesta URL (deduiria el driver de MySQL, absent de la classpath).
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USER:videoteca}
    password: ${DB_PASSWORD:videoteca_dev}
  jpa:
    hibernate:
      # Actualitza l'esquema segons les entitats (projecte en desenvolupament).
      ddl-auto: update
    # No obri la sessió JPA durant el processament HTTP (bona pràctica).
    open-in-view: false

# URL per defecte del servidor Eureka.
# Sobrescriu-la en l'entorn (docker-compose) amb EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
# (per exemple, http://eureka:8761/eureka dins de la xarxa de Docker).
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health
